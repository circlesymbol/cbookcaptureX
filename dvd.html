<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pre-Stretched 4:3 DVD Bounce (Solid PNG Tint)</title>
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: #000;
            overflow: hidden;
        }
        #canvas-full {
            position: relative;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            overflow: hidden;
        }
        
        /* Container to hold and shift the image asset */
        .logo-wrapper {
            position: absolute;
            width: 170px;
            height: 56px;
            overflow: hidden; /* Clamps the offset trick so the white source graphic is hidden */
            left: 0; top: 0;
            pointer-events: none;
        }

        #dvd-logo {
            position: absolute;
            width: 170px;
            height: 56px;
            /* 1. Shifts the asset exactly 170px to the left
               2. Forces everything inside the PNG to become a solid white shape
               3. Projects a crisp, un-blurred shadow exactly 170px back to the right */
            left: -170px;
            filter: brightness(0) invert(1) drop-shadow(170px 0px 0px #00E676);
        }
    </style>
</head>
<body>

    <div id="canvas-full">
        <div id="logo-container" class="logo-wrapper">
            <img id="dvd-logo" src="dvd.png" alt="DVD Video">
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas-full');
        const container = document.getElementById('logo-container');
        const logo = document.getElementById('dvd-logo');

        // Solid hex fills that change the entire image on impact
        const retroColors = ['#00E676', '#FF3333', '#00B0FF', '#FFEA00', '#D500F9', '#FF6D00', '#FFFFFF'];

        let currentWidth = canvas.clientWidth;
        let currentHeight = canvas.clientHeight;
        
        const logoWidth = 170; 
        const logoHeight = 56;

        let posX = Math.floor(Math.random() * (currentWidth - logoWidth));
        let posY = Math.floor(Math.random() * (currentHeight - logoHeight));
        
        let velX = 4.5; 
        let velY = 4.5;
        let colorIndex = 0;

        function updateBounds() {
            currentWidth = canvas.clientWidth;
            currentHeight = canvas.clientHeight;
        }

        function animate() {
            posX += velX; posY += velY;
            let hitEdge = false;

            if (posX + logoWidth >= currentWidth) { 
                posX = currentWidth - logoWidth; 
                velX = -velX; 
                hitEdge = true; 
            } else if (posX <= 0) { 
                posX = 0; 
                velX = -velX; 
                hitEdge = true; 
            }

            if (posY + logoHeight >= currentHeight) { 
                posY = currentHeight - logoHeight; 
                velY = -velY; 
                hitEdge = true; 
            } else if (posY <= 0) { 
                posY = 0; 
                velY = -velY; 
                hitEdge = true; 
            }

            if (hitEdge) {
                let nextColorIndex = Math.floor(Math.random() * retroColors.length);
                if (nextColorIndex === colorIndex) nextColorIndex = (nextColorIndex + 1) % retroColors.length;
                colorIndex = nextColorIndex;
                
                // Keep the shift matrix intact while swapping the solid hex fill color
                logo.style.filter = `brightness(0) invert(1) drop-shadow(170px 0px 0px ${retroColors[colorIndex]})`;
            }

            container.style.transform = `translate3d(${posX}px, ${posY}px, 0)`;
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            updateBounds();
            if (posX + logoWidth > currentWidth) posX = currentWidth - logoWidth;
            if (posY + logoHeight > currentHeight) posY = currentHeight - logoHeight;
        });

        updateBounds();
        requestAnimationFrame(animate);
    </script>
</body>
</html>
