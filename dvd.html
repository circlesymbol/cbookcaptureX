<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pre-Stretched 4:3 DVD Bounce (PNG Version)</title>
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: #000;
            overflow: hidden;
        }
        #canvas-full {
            position: relative;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            overflow: hidden;
        }
        /* Custom image asset wrapper:
           Stretched horizontally to 170px to compensate for the 
           subsequent analog downscaler compression.
        */
        #dvd-logo {
            position: absolute;
            width: 170px;
            height: 56px;
            pointer-events: none;
            left: 0; top: 0;
            /* Applies a vintage color overlay filter onto the asset. 
               This lets us dynamically shift the solid color on every bounce. */
            filter: drop-shadow(0px 0px 0px #00E676);
        }
    </style>
</head>
<body>

    <div id="canvas-full">
        <img id="dvd-logo" src="dvd.png" alt="DVD Video">
    </div>

    <script>
        const canvas = document.getElementById('canvas-full');
        const logo = document.getElementById('dvd-logo');

        // Retro hex colors used to tint your PNG asset dynamically
        const retroColors = ['#00E676', '#FF3333', '#00B0FF', '#FFEA00', '#D500F9', '#FF6D00', '#FFFFFF'];

        let currentWidth = canvas.clientWidth;
        let currentHeight = canvas.clientHeight;
        
        // Exact container size matching the CSS properties
        const logoWidth = 170; 
        const logoHeight = 56;

        let posX = Math.floor(Math.random() * (currentWidth - logoWidth));
        let posY = Math.floor(Math.random() * (currentHeight - logoHeight));
        
        // Increased tracking velocity to compensate for the wider screen real estate
        let velX = 4.5; 
        let velY = 4.5;
        let colorIndex = 0;

        function updateBounds() {
            currentWidth = canvas.clientWidth;
            currentHeight = canvas.clientHeight;
        }

        function animate() {
            posX += velX; posY += velY;
            let hitEdge = false;

            // X-axis border collisions
            if (posX + logoWidth >= currentWidth) { 
                posX = currentWidth - logoWidth; 
                velX = -velX; 
                hitEdge = true; 
            } else if (posX <= 0) { 
                posX = 0; 
                velX = -velX; 
                hitEdge = true; 
            }

            // Y-axis border collisions
            if (posY + logoHeight >= currentHeight) { 
                posY = currentHeight - logoHeight; 
                velY = -velY; 
                hitEdge = true; 
            } else if (posY <= 0) { 
                posY = 0; 
                velY = -velY; 
                hitEdge = true; 
            }

            // On impact, cycle colors using a CSS filter trick on the PNG transparent layer
            if (hitEdge) {
                let nextColorIndex = Math.floor(Math.random() * retroColors.length);
                if (nextColorIndex === colorIndex) nextColorIndex = (nextColorIndex + 1) % retroColors.length;
                colorIndex = nextColorIndex;
                
                // Shift color values on the asset via precise drop-shadow rendering injection
                logo.style.filter = `drop-shadow(0px 0px 0px ${retroColors[colorIndex]})`;
            }

            logo.style.transform = `translate3d(${posX}px, ${posY}px, 0)`;
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            updateBounds();
            if (posX + logoWidth > currentWidth) posX = currentWidth - logoWidth;
            if (posY + logoHeight > currentHeight) posY = currentHeight - logoHeight;
        });

        updateBounds();
        requestAnimationFrame(animate);
    </script>
</body>
</html>
