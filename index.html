<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gameplay Capture</title>
    <style>
        body { background: #111; color: #fff; font-family: sans-serif; margin: 0; padding: 20px; text-align: center; }
        video { width: 80%; max-width: 800px; background: #000; border: 4px solid #333; border-radius: 8px; }
        #hud { margin: 20px; font-size: 1.2rem; font-weight: bold; }
        button { background: #ff3333; color: white; border: none; padding: 12px 24px; font-size: 1rem; font-weight: bold; border-radius: 4px; cursor: pointer; }
        button:hover { background: #cc0000; }
    </style>
</head>
<body>

    <h1>Gameplay Capture</h1>
    <video id="v" autoplay playsinline></video>
    <div id="hud">🔴 Press Button or [SPACEBAR] to Start</div>
    <button id="click-trigger">🔴 Start Recording</button>

<script>
    const videoElement = document.getElementById('v');
    const hud = document.getElementById('hud');
    const clickTrigger = document.getElementById('click-trigger');
    
    let isRecording = false;
    let stream = null;
    let videoProcessor = null;
    
    let frameStorageBuffer = []; 
    let recordedChunks = [];
    
    const offlineCanvas = document.createElement('canvas');
    const ctx = offlineCanvas.getContext('2d');
    offlineCanvas.width = 1920;  // Kept your 1080p canvas scale
    offlineCanvas.height = 1080;

    let recordingSeconds = 0;
    let recordingInterval = null;

    function formatTimeString(totalSeconds) {
        const mins = Math.floor(totalSeconds / 60).toString().padStart(2, '0');
        const secs = (totalSeconds % 60).toString().padStart(2, '0');
        return mins + ':' + secs;
    }
    
    async function initCapture() {
        try {
            stream = await navigator.mediaDevices.getUserMedia({
                video: { width: 1920, height: 1080, frameRate: 60 },
                audio: false
            });
            videoElement.srcObject = stream;
            hud.innerText = "🔴 Press Button or [SPACEBAR] to Start";
        } catch (err) {
            hud.innerText = "⚠️ Connection error.";
        }
    }

    async function startFrameHoard() {
        frameStorageBuffer = []; 
        const videoTrack = stream.getVideoTracks()[0];
        
        videoProcessor = new MediaStreamTrackProcessor({ track: videoTrack });
        const reader = videoProcessor.readable.getReader();
        
        isRecording = true;
        recordingSeconds = 0;
        clickTrigger.innerText = '⏹️ Stop [00:00]';
        hud.innerText = "Recording...";

        recordingInterval = setInterval(() => {
            recordingSeconds++;
            clickTrigger.innerText = '⏹️ Stop [' + formatTimeString(recordingSeconds) + ']';
        }, 1000);

        (async function hoard() {
            while (isRecording) {
                const { done, value } = await reader.read();
                if (done) break;
                if (!isRecording) { value.close(); break; }
                frameStorageBuffer.push(value); 
            }
        })();
    }

    async function stopAndBake() {
        isRecording = false;
        clearInterval(recordingInterval);
        clickTrigger.innerText = "💾 Saving File...";
        hud.innerText = "Processing frames...";

        recordedChunks = [];
        const canvasStream = offlineCanvas.captureStream(60);
        
        const mediaRecorder = new MediaRecorder(canvasStream, {
            mimeType: 'video/webm;codecs=vp8',
            videoBitsPerSecond: 25000000
        });
        
        mediaRecorder.ondataavailable = (e) => {
            if (e.data && e.data.size > 0) recordedChunks.push(e.data);
        };

        mediaRecorder.onstop = () => {
            const blob = new Blob(recordedChunks, { type: 'video/webm' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'gameplay_1080p60_stable_' + Date.now() + '.webm';
            document.body.appendChild(a);
            a.click();
            
            setTimeout(() => {
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);
                frameStorageBuffer = [];
                clickTrigger.innerText = "🔴 Start Recording";
                hud.innerText = "🔴 Press Button or [SPACEBAR] to Start";
            }, 500);
        };

        mediaRecorder.start();

        let currentFrameIndex = 0;

        function bakeFrame() {
            if (currentFrameIndex >= frameStorageBuffer.length) {
                mediaRecorder.stop();
                return;
            }

            const videoFrame = frameStorageBuffer[currentFrameIndex];
            ctx.drawImage(videoFrame, 0, 0, offlineCanvas.width, offlineCanvas.height);
            videoFrame.close(); 

            if (currentFrameIndex % 30 === 0) {
                const percentage = Math.round((currentFrameIndex / frameStorageBuffer.length) * 100);
                hud.innerText = "Baking Video: " + percentage + "%";
            }

            currentFrameIndex++;
            setTimeout(bakeFrame, 16); 
        }

        bakeFrame();
    }

    function toggleCapture() {
        if (!stream) return;
        if (!isRecording) startFrameHoard(); else stopAndBake();
    }

    window.onkeydown = (e) => { if (e.code === 'Space') { e.preventDefault(); toggleCapture(); } };
    clickTrigger.addEventListener('click', toggleCapture);
    window.addEventListener('DOMContentLoaded', initCapture);
</script>
</body>
</html>
