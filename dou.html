<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chromebook Hybrid Studio</title>
    <style>
        body { background: #121212; color: #fff; font-family: sans-serif; padding: 20px; text-align: center; }
        .box { max-width: 800px; margin: 0 auto; background: #1e1e1e; padding: 20px; border-radius: 8px; }
        select, button { padding: 10px; margin: 10px; background: #252525; color: #fff; border: 1px solid #333; border-radius: 4px; }
        button { background: #00adb5; font-weight: bold; cursor: pointer; }
        canvas { width: 100%; max-width: 640px; aspect-ratio: 16/9; background: #000; margin-top: 20px; border-radius: 8px; }
    </style>
</head>
<body>

<div class="box">
    <h2>Chromebook Hybrid Studio (Stable Code Build)</h2>
    <button id="pBtn">1. Grant Hardware Permissions</button>
    <div id="controls" style="display:none;">
        <p>Webcam Overlay: <select id="oSel"></select></p>
        <p>Capture Card Audio Line: <select id="aSel1"></select></p>
        <p>Your Voice Microphone: <select id="aSel2"></select></p>
        <button id="vBtn">2. Share Screen & Map Lines</button>
        <button id="rBtn" style="display:none; background:#ff2e63;">3. Start Synced Recording</button>
        <button id="sBtn" style="display:none; background:#555;">Stop & Save</button>
    </div>
    <div id="st" style="margin:10px; color:#888;">Awaiting launch...</div>
    <canvas id="cv"></canvas>
</div>

<script>
    const pBtn = document.getElementById('pBtn');
    const vBtn = document.getElementById('vBtn');
    const rBtn = document.getElementById('rBtn');
    const sBtn = document.getElementById('sBtn');
    const oSel = document.getElementById('oSel');
    const aSel1 = document.getElementById('aSel1');
    const aSel2 = document.getElementById('aSel2');
    const cv = document.getElementById('cv');
    const ctx = cv.getContext('2d');
    const st = document.getElementById('st');

    cv.width = 1280; cv.height = 720;

    let bVid = document.createElement('video');
    let oVid = document.createElement('video');
    bVid.muted = true; bVid.autoplay = true; bVid.playsInline = true;
    oVid.muted = true; oVid.autoplay = true; oVid.playsInline = true;

    let bStr, oStr, aStr1, aStr2, mStr, recorder, worker, audioCtx, audioDestination;
    let chunks = [];

    pBtn.addEventListener('click', async () => {
        try {
            st.innerText = "Scanning system hardware buses...";
            
            // Baseline hardware request to trigger system browser popup cleanly
            const aInit = await navigator.mediaDevices.getUserMedia({ audio: true });
            const vInit = await navigator.mediaDevices.getUserMedia({ video: true });
            aInit.getTracks().forEach(t => t.stop()); vInit.getTracks().forEach(t => t.stop());

            const dev = await navigator.mediaDevices.enumerateDevices();
            const vDev = dev.filter(d => d.kind === 'videoinput');
            const aDev = dev.filter(d => d.kind === 'audioinput');

            // TYPO FIXED: Cleaned up variables to target actual dropdown configurations
            oSel.innerHTML = ''; aSel1.innerHTML = ''; aSel2.innerHTML = '';

            vDev.forEach((d, i) => {
                let o = document.createElement('option'); o.value = d.deviceId; o.text = d.label || "Webcam " + (i+1); oSel.appendChild(o);
            });

            aDev.forEach((d, i) => {
                let o1 = document.createElement('option'); o1.value = d.deviceId; o1.text = d.label || "Audio Input " + (i+1); aSel1.appendChild(o1);
                let o2 = document.createElement('option'); o2.value = d.deviceId; o2.text = d.label || "Audio Input " + (i+1); aSel2.appendChild(o2);
            });
            
            if(aDev.length > 1) {
                aSel1.selectedIndex = 0; 
                aSel2.selectedIndex = 1; 
            }

            document.getElementById('controls').style.display = 'block';
            pBtn.style.display = 'none';
            st.innerText = "Buses matched. Map tracks and initialize layout.";
        } catch (err) {
            st.innerText = "Permission System Failure: " + err.name + " - " + err.message;
            console.error(err);
        }
    });

    vBtn.addEventListener('click', async () => {
        try {
            st.innerText = "Locking independent hardware layers...";
            if(worker) worker.terminate();

            aStr1 = await navigator.mediaDevices.getUserMedia({
                audio: { deviceId: { exact: aSel1.value }, echoCancellation: false, noiseSuppression: false, autoGainControl: false }
            });

            aStr2 = await navigator.mediaDevices.getUserMedia({
                audio: { deviceId: { exact: aSel2.value }, echoCancellation: false, noiseSuppression: false, autoGainControl: false }
            });

            oStr = await navigator.mediaDevices.getUserMedia({
                video: { deviceId: { exact: oSel.value }, width: 640, height: 480 }
            });
            oVid.srcObject = oStr; await oVid.play();

            bStr = await navigator.mediaDevices.getDisplayMedia({
                video: { width: 1280, height: 720, frameRate: 30 },
                audio: false
            });
            bVid.srcObject = bStr; await bVid.play();

            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            audioDestination = audioCtx.createMediaStreamDestination();

            const cardSource = audioCtx.createMediaStreamSource(aStr1);
            const micSource = audioCtx.createMediaStreamSource(aStr2);

            const micDelayNode = audioCtx.createDelay(1.0);
            micDelayNode.delayTime.value = 0.0; 

            cardSource.connect(audioDestination);
            micSource.connect(micDelayNode);
            micDelayNode.connect(audioDestination);

            const workerCode = `
                let timer = null;
                self.onmessage = function(e) {
                    if (e.data === 'start') {
                        timer = setInterval(() => { self.postMessage('tick'); }, 33);
                    } else if (e.data === 'stop') {
                        clearInterval(timer);
                    }
                };
            `;
            const blob = new Blob([workerCode], { type: 'application/javascript' });
            worker = new Worker(URL.createObjectURL(blob));

            worker.onmessage = function(e) {
                if (e.data === 'tick') {
                    ctx.imageSmoothingEnabled = false;
                    ctx.drawImage(bVid, 0, 0, 1280, 720);
                    ctx.drawImage(oVid, 940, 480, 320, 210);
                }
            };
            worker.postMessage('start');

            vBtn.style.display = 'none';
            rBtn.style.display = 'inline-block';
            st.innerText = "Tracks fully isolated. Verify choices and hit record!";
        } catch (err) {
            st.innerText = "Mapping Error: " + err.name + " - " + err.message;
            console.error(err);
        }
    });

    rBtn.addEventListener('click', async () => {
        if (audioCtx && audioCtx.state === 'suspended') {
            await audioCtx.resume();
        }

        chunks = [];
        const cStr = cv.captureStream(30);
        mStr = new MediaStream();
        cStr.getVideoTracks().forEach(t => mStr.addTrack(t));
        audioDestination.stream.getAudioTracks().forEach(t => mStr.addTrack(t));

        let opt = { mimeType: 'video/webm;codecs=vp8,opus', videoBitsPerSecond: 2600000 };
        if (!MediaRecorder.isTypeSupported(opt.mimeType)) opt = { mimeType: 'video/webm', videoBitsPerSecond: 2600000 };

        recorder = new MediaRecorder(mStr, opt);
        recorder.ondataavailable = (e) => { if(e.data && e.data.size > 0) chunks.push(e.data); };
        
        recorder.onstop = () => {
            const blob = new Blob(chunks, { type: 'video/webm' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = "hybrid_distinct_reaction.webm";
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            URL.revokeObjectURL(url); st.innerText = "Saved smoothly to Downloads.";
        };

        recorder.start(1000);
        rBtn.style.display = 'none';
        sBtn.style.display = 'inline-block';
        st.innerText = "🔴 RECORDING SYNCED SEPARATE MIC TRACKS.";
    });

    sBtn.addEventListener('click', () => {
        recorder.stop();
        if(worker) worker.postMessage('stop');
        if (audioCtx) audioCtx.close();
        sBtn.style.display = 'none';
        rBtn.style.display = 'inline-block';
    });
</script>

</body>
</html>
