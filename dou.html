<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chromebook GPU Studio Pro</title>
    <style>
        body { background: #121212; color: #fff; font-family: sans-serif; padding: 20px; text-align: center; }
        .box { max-width: 800px; margin: 0 auto; background: #1e1e1e; padding: 20px; border-radius: 8px; }
        select, button { padding: 10px; margin: 10px; background: #252525; color: #fff; border: 1px solid #333; border-radius: 4px; }
        button { background: #00adb5; font-weight: bold; cursor: pointer; }
        canvas { width: 100%; max-width: 640px; aspect-ratio: 16/9; background: #000; margin-top: 20px; border-radius: 8px; }
    </style>
</head>
<body>

<div class="box">
    <h2>Chromebook Zero-Load GPU Studio (Audio Booster Build)</h2>
    <button id="pBtn">1. Grant Webcam & Microphone Access</button>
    <div id="controls" style="display:none;">
        <p>Webcam Overlay: <select id="oSel"></select></p>
        <p>Your Voice Microphone: <select id="aSel"></select></p>
        <button id="vBtn">2. Initialize Hardware Screen Feed</button>
        <button id="rBtn" style="display:none; background:#ff2e63;">3. Start Crystal-Clear Recording</button>
        <button id="sBtn" style="display:none; background:#555;">Stop & Save</button>
    </div>
    <div id="st" style="margin:10px; color:#888;">Awaiting launch...</div>
    <canvas id="cv"></canvas>
</div>

<script>
    const pBtn = document.getElementById('pBtn');
    const vBtn = document.getElementById('vBtn');
    const rBtn = document.getElementById('rBtn');
    const sBtn = document.getElementById('sBtn');
    const oSel = document.getElementById('oSel');
    const aSel = document.getElementById('aSel');
    const cv = document.getElementById('cv');
    const ctx = cv.getContext('2d');
    const st = document.getElementById('st');

    cv.width = 1280;
    cv.height = 720;

    let bVid = document.createElement('video');
    let oVid = document.createElement('video');
    bVid.muted = true; bVid.autoplay = true; bVid.playsInline = true;
    oVid.muted = true; oVid.autoplay = true; oVid.playsInline = true;

    let bStr, oStr, aStr, mStr, recorder, worker, audioCtx, audioDestination;
    let chunks = [];

    pBtn.addEventListener('click', async () => {
        try {
            st.innerText = "Initializing audio/video buses...";
            const aInit = await navigator.mediaDevices.getUserMedia({ audio: true });
            const vInit = await navigator.mediaDevices.getUserMedia({ video: true });
            aInit.getTracks().forEach(t => t.stop());
            vInit.getTracks().forEach(t => t.stop());

            const dev = await navigator.mediaDevices.enumerateDevices();
            const vDev = dev.filter(d => d.kind === 'videoinput');
            const aDev = dev.filter(d => d.kind === 'audioinput');

            oSel.innerHTML = ''; aSel.innerHTML = '';
            vDev.forEach((d, i) => {
                let o = document.createElement('option'); o.value = d.deviceId; o.text = d.label || "Webcam " + (i+1); oSel.appendChild(o);
            });
            aDev.forEach((d, i) => {
                let o = document.createElement('option'); o.value = d.deviceId; o.text = d.label || "Microphone " + (i+1); aSel.appendChild(o);
            });

            document.getElementById('controls').style.display = 'block';
            pBtn.style.display = 'none';
            st.innerText = "Webcam and audio verified. Click Initialize Hardware Screen Feed.";
        } catch (e) {
            st.innerText = "Secure connection required (HTTPS).";
        }
    });

    vBtn.addEventListener('click', async () => {
        try {
            st.innerText = "Configuring unthrottled hardware buffers...";
            if(worker) worker.terminate();

            // Open microphone channel
            aStr = await navigator.mediaDevices.getUserMedia({
                audio: { deviceId: { exact: aSel.value }, echoCancellation: false, noiseSuppression: false, autoGainControl: false }
            });

            // Open webcam feed cleanly
            oStr = await navigator.mediaDevices.getUserMedia({
                video: { deviceId: { exact: oSel.value }, width: { ideal: 640 }, height: { ideal: 480 } }
            });
            oVid.srcObject = oStr; await oVid.play();

            // GPU Screen Grab with enabled system track audio channels
            bStr = await navigator.mediaDevices.getDisplayMedia({
                video: { width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 30 } },
                audio: true // Enabled so Chrome prompts you to share system/tab sound
            });
            bVid.srcObject = bStr; await bVid.play();

            // CORE AUDIO MIXER & BOOSTER SYSTEM
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            audioDestination = audioCtx.createMediaStreamDestination();

            // Map microphone input stream into mixing board
            const micSource = audioCtx.createMediaStreamSource(aStr);
            micSource.connect(audioDestination);

            // Check if user actively ticked the "Share tab audio" box
            if (bStr.getAudioTracks().length > 0) {
                const tabAudioSource = audioCtx.createMediaStreamSource(bStr);
                
                // Build a virtual gain amplifier box
                const tabGainNode = audioCtx.createGain();
                tabGainNode.gain.value = 1.8; // Boosts the stream video volume by 80%
                
                // Route stream sound -> through amplifier -> directly into final recorder file
                tabAudioSource.connect(tabGainNode);
                tabGainNode.connect(audioDestination);
            }

            const workerCode = `
                let timer = null;
                self.onmessage = function(e) {
                    if (e.data === 'start') {
                        timer = setInterval(() => { self.postMessage('tick'); }, 33);
                    } else if (e.data === 'stop') {
                        clearInterval(timer);
                    }
                };
            `;
            const blob = new Blob([workerCode], { type: 'application/javascript' });
            worker = new Worker(URL.createObjectURL(blob));

            worker.onmessage = function(e) {
                if (e.data === 'tick') {
                    ctx.imageSmoothingEnabled = false;
                    ctx.drawImage(bVid, 0, 0, 1280, 720);
                    ctx.drawImage(oVid, 940, 480, 320, 210);
                }
            };
            worker.postMessage('start');

            vBtn.style.display = 'none';
            rBtn.style.display = 'inline-block';
            st.innerText = "Hardware layers locked. Make sure 'Share tab audio' was checked!";
        } catch (e) {
            st.innerText = "Hardware setup cancelled or rejected.";
        }
    });

    rBtn.addEventListener('click', () => {
        chunks = [];
        const cStr = cv.captureStream(30);
        mStr = new MediaStream();
        cStr.getVideoTracks().forEach(t => mStr.addTrack(t));
        
        // Feed our boosted master audio mixer stream to the recording pipeline
        audioDestination.stream.getAudioTracks().forEach(t => mStr.addTrack(t));

        // OPTIMIZED BITRATE MIX PROFILE:
        // Set to 2.6 Mbps to clean up all compression pixel noise while remaining 
        // light enough for the Intel Quick Sync chip to handle with 0% CPU lag.
        let opt = { 
            mimeType: 'video/webm;codecs=vp8,opus',
            videoBitsPerSecond: 2600000 
        };
        if (!MediaRecorder.isTypeSupported(opt.mimeType)) {
            opt = { mimeType: 'video/webm', videoBitsPerSecond: 2600000 };
        }

        recorder = new MediaRecorder(mStr, opt);
        recorder.ondataavailable = (e) => { if (e.data && e.data.size > 0) chunks.push(e.data); };
        
        recorder.onstop = () => {
            const blob = new Blob(chunks, { type: 'video/webm' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = "crisp_hd_reaction.webm";
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            URL.revokeObjectURL(url); st.innerText = "Completed HD file saved directly to Downloads.";
        };

        recorder.start(1000);
        rBtn.style.display = 'none';
        sBtn.style.display = 'inline-block';
        st.innerText = "🔴 RECORDING LIVE THROUGH NATIVE GPU PIPELINES.";
    });

    sBtn.addEventListener('click', () => {
        recorder.stop();
        if(worker) worker.postMessage('stop');
        if (audioCtx) audioCtx.close();
        st.innerText = "Compiling crisp output track...";
        sBtn.style.display = 'none';
        rBtn.style.display = 'inline-block';
    });
</script>

</body>
</html>
