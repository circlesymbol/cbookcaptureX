<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chromebook Unfiltered Studio</title>
    <style>
        body { background: #121212; color: #fff; font-family: sans-serif; padding: 20px; text-align: center; }
        .box { max-width: 800px; margin: 0 auto; background: #1e1e1e; padding: 20px; border-radius: 8px; }
        select, button { padding: 10px; margin: 10px; background: #252525; color: #fff; border: 1px solid #333; border-radius: 4px; }
        button { background: #00adb5; font-weight: bold; cursor: pointer; }
        canvas { width: 100%; max-width: 640px; aspect-ratio: 16/9; background: #000; margin-top: 20px; border-radius: 8px; }
    </style>
</head>
<body>

<div class="box">
    <h2>Chromebook Unfiltered Loop Studio</h2>
    <button id="pBtn">1. Unlock System Hardware</button>
    <div id="controls" style="display:none;">
        <p>Webcam Overlay: <select id="oSel"></select></p>
        <p>System Loop Audio Source: <select id="aSel1"></select></p>
        <p>Your Voice Microphone: <select id="aSel2"></select></p>
        <button id="vBtn">2. Link Screen Layout</button>
        <button id="rBtn" style="display:none; background:#ff2e63;">3. Start Crisp Recording</button>
        <button id="sBtn" style="display:none; background:#555;">Stop & Save</button>
    </div>
    <div id="st" style="margin:10px; color:#888;">Awaiting launch...</div>
    <canvas id="cv"></canvas>
</div>

<script>
    const pBtn = document.getElementById('pBtn');
    const vBtn = document.getElementById('vBtn');
    const rBtn = document.getElementById('rBtn');
    const sBtn = document.getElementById('sBtn');
    const oSel = document.getElementById('oSel');
    const aSel1 = document.getElementById('aSel1');
    const aSel2 = document.getElementById('aSel2');
    const cv = document.getElementById('cv');
    const ctx = cv.getContext('2d');
    const st = document.getElementById('st');

    cv.width = 1280; cv.height = 720;

    let bVid = document.createElement('video');
    let oVid = document.createElement('video');
    bVid.muted = true; bVid.autoplay = true; bVid.playsInline = true;
    oVid.muted = true; oVid.autoplay = true; oVid.playsInline = true;

    let bStr, oStr, aStr1, aStr2, mStr, recorder, worker;
    let chunks = [];

    pBtn.addEventListener('click', async () => {
        try {
            st.innerText = "Scanning audio buses...";
            // Open baseline channels to read labels
            const aInit = await navigator.mediaDevices.getUserMedia({ audio: true });
            const vInit = await navigator.mediaDevices.getUserMedia({ video: true });
            aInit.getTracks().forEach(t => t.stop()); vInit.getTracks().forEach(t => t.stop());

            const dev = await navigator.mediaDevices.enumerateDevices();
            const vDev = dev.filter(d => d.kind === 'videoinput');
            const aDev = dev.filter(d => d.kind === 'audioinput');

            oSel.innerHTML = ''; aSel1.innerHTML = ''; aSel2.innerHTML = '';

            vDev.forEach((d, i) => {
                let o = document.createElement('option'); o.value = d.deviceId; o.text = d.label || "Webcam " + (i+1); oSel.appendChild(o);
            });

            aDev.forEach((d, i) => {
                let o1 = document.createElement('option'); o1.value = d.deviceId; o1.text = d.label || "Audio Input Line " + (i+1); aSel1.appendChild(o1);
                let o2 = document.createElement('option'); o2.value = d.deviceId; o2.text = d.label || "Audio Input Line " + (i+1); aSel2.appendChild(o2);
            });
            if(aDev.length > 1) aSel2.selectedIndex = 1;

            document.getElementById('controls').style.display = 'block';
            pBtn.style.display = 'none';
            st.innerText = "Hardware found. Choose your tracks and link layout.";
        } catch (e) {
            st.innerText = "Secure connection required (HTTPS).";
        }
    });

    vBtn.addEventListener('click', async () => {
        try {
            st.innerText = "Injecting unfiltered media constraints...";
            if(worker) worker.terminate();

            // SCRIPT IMPLEMENTATION: Applying your exact filter-kill constraints
            // inside getUserMedia to force Chrome to accept raw, uncompressed bytes!
            
            // Channel 1: The System/YouTube Audio Loop Input
            aStr1 = await navigator.mediaDevices.getUserMedia({
                audio: { 
                    deviceId: { exact: aSel1.value }, 
                    echoCancellation: false, 
                    noiseSuppression: false, 
                    autoGainControl: false 
                }
            });

            // Channel 2: Your Voice Microphone Input
            aStr2 = await navigator.mediaDevices.getUserMedia({
                audio: { 
                    deviceId: { exact: aSel2.value }, 
                    echoCancellation: false, 
                    noiseSuppression: false, 
                    autoGainControl: false 
                }
            });

            // Open webcam feed cleanly
            oStr = await navigator.mediaDevices.getUserMedia({
                video: { deviceId: { exact: oSel.value }, width: 640, height: 480 }
            });
            oVid.srcObject = oStr; await oVid.play();

            // Grab the video track ONLY from getDisplayMedia, discarding the broken audio track entirely
            bStr = await navigator.mediaDevices.getDisplayMedia({
                video: { width: 1280, height: 720, frameRate: 30 },
                audio: false
            });
            bVid.srcObject = bStr; await bVid.play();

            const workerCode = `
                let timer = null;
                self.onmessage = function(e) {
                    if (e.data === 'start') {
                        timer = setInterval(() => { self.postMessage('tick'); }, 33);
                    } else if (e.data === 'stop') {
                        clearInterval(timer);
                    }
                };
            `;
            const blob = new Blob([workerCode], { type: 'application/javascript' });
            worker = new Worker(URL.createObjectURL(blob));

            worker.onmessage = function(e) {
                if (e.data === 'tick') {
                    ctx.imageSmoothingEnabled = false;
                    ctx.drawImage(bVid, 0, 0, 1280, 720);
                    ctx.drawImage(oVid, 940, 480, 320, 210);
                }
            };
            worker.postMessage('start');

            vBtn.style.display = 'none';
            rBtn.style.display = 'inline-block';
            st.innerText = "Bypass active. Ready to capture.";
        } catch (e) {
            st.innerText = "Setup error. Verify your input devices.";
        }
    });

    rBtn.addEventListener('click', () => {
        chunks = [];
        const cStr = cv.captureStream(30);
        mStr = new MediaStream();
        cStr.getVideoTracks().forEach(t => mStr.addTrack(t));
        
        // Write the two independent, unsuppressed getUserMedia audio lines straight to the container
        aStr1.getAudioTracks().forEach(t => mStr.addTrack(t));
        aStr2.getAudioTracks().forEach(t => mStr.addTrack(t));

        let opt = { mimeType: 'video/webm;codecs=vp8,opus', videoBitsPerSecond: 2600000 };
        if (!MediaRecorder.isTypeSupported(opt.mimeType)) opt = { mimeType: 'video/webm', videoBitsPerSecond: 2600000 };

        recorder = new MediaRecorder(mStr, opt);
        recorder.ondataavailable = (e) => { if (e.data && e.data.size > 0) chunks.push(e.data); };
        
        recorder.onstop = () => {
            const blob = new Blob(chunks, { type: 'video/webm' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = "unfiltered_hd_reaction.webm";
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            URL.revokeObjectURL(url); st.innerText = "Completed HD file saved directly to Downloads.";
        };

        recorder.start(1000);
        rBtn.style.display = 'none';
        sBtn.style.display = 'inline-block';
        st.innerText = "🔴 RECORDING LIVE (WebRTC Suppression Defeated).";
    });

    sBtn.addEventListener('click', () => {
        recorder.stop();
        if(worker) worker.postMessage('stop');
        sBtn.style.display = 'none';
        rBtn.style.display = 'inline-block';
    });
</script>

</body>
</html>
