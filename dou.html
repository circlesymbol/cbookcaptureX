<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chromebook Native Studio</title>
    <style>
        body { background: #121212; color: #fff; font-family: sans-serif; padding: 20px; text-align: center; }
        .box { max-width: 800px; margin: 0 auto; background: #1e1e1e; padding: 20px; border-radius: 8px; }
        select, button { padding: 10px; margin: 10px; background: #252525; color: #fff; border: 1px solid #333; border-radius: 4px; }
        button { background: #00adb5; font-weight: bold; cursor: pointer; }
        canvas { width: 100%; max-width: 640px; aspect-ratio: 16/9; background: #000; margin-top: 20px; }
    </style>
</head>
<body>

<div class="box">
    <h2>Chromebook Native Stream Recorder (No Canvas-Cap)</h2>
    <button id="pBtn">Click to Unlock Hardware</button>
    <div id="controls" style="display:none;">
        <p>Capture Card Video: <select id="bSel"></select></p>
        <p>Webcam Video: <select id="oSel"></select></p>
        <p>Capture Card Audio: <select id="aSel1"></select></p>
        <p>Your Voice Microphone: <select id="aSel2"></select></p>
        <button id="vBtn">Load Layout & Mix Audio</button>
        <button id="rBtn" style="display:none; background:#ff2e63;">Start Recording</button>
        <button id="sBtn" style="display:none; background:#555;">Stop & Save</button>
    </div>
    <div id="st" style="margin:10px; color:#888;">Awaiting launch...</div>
    <canvas id="cv"></canvas>
</div>

<script>
    const pBtn = document.getElementById('pBtn');
    const vBtn = document.getElementById('vBtn');
    const rBtn = document.getElementById('rBtn');
    const sBtn = document.getElementById('sBtn');
    const bSel = document.getElementById('bSel');
    const oSel = document.getElementById('oSel');
    const aSel1 = document.getElementById('aSel1');
    const aSel2 = document.getElementById('aSel2');
    const cv = document.getElementById('cv');
    const ctx = cv.getContext('2d');
    const st = document.getElementById('st');

    cv.width = 1280;
    cv.height = 720;

    let bVid = document.createElement('video');
    let oVid = document.createElement('video');
    bVid.muted = true; bVid.autoplay = true; bVid.playsInline = true;
    oVid.muted = true; oVid.autoplay = true; oVid.playsInline = true;

    let bStr, oStr, aStr1, aStr2, recorder, audioCtx, audioDestination;
    let chunks = [];
    let worker;

    pBtn.addEventListener('click', async () => {
        try {
            st.innerText = "Unlocking system devices...";
            const aInit = await navigator.mediaDevices.getUserMedia({ audio: true });
            const vInit = await navigator.mediaDevices.getUserMedia({ video: true });
            
            aInit.getTracks().forEach(t => t.stop());
            vInit.getTracks().forEach(t => t.stop());

            const dev = await navigator.mediaDevices.enumerateDevices();
            const vDev = dev.filter(d => d.kind === 'videoinput');
            const aDev = dev.filter(d => d.kind === 'audioinput');

            bSel.innerHTML = ''; oSel.innerHTML = ''; aSel1.innerHTML = ''; aSel2.innerHTML = '';

            vDev.forEach((d, i) => {
                let o1 = document.createElement('option'); o1.value = d.deviceId; o1.text = d.label || "Camera " + (i+1); bSel.appendChild(o1);
                let o2 = document.createElement('option'); o2.value = d.deviceId; o2.text = d.label || "Camera " + (i+1); oSel.appendChild(o2);
            });
            if(vDev.length > 1) oSel.selectedIndex = 1;

            aDev.forEach((d, i) => {
                let o1 = document.createElement('option'); o1.value = d.deviceId; o1.text = d.label || "Audio Source " + (i+1); aSel1.appendChild(o1);
                let o2 = document.createElement('option'); o2.value = d.deviceId; o2.text = d.label || "Audio Source " + (i+1); aSel2.appendChild(o2);
            });
            if(aDev.length > 1) aSel2.selectedIndex = 1;

            document.getElementById('controls').style.display = 'block';
            pBtn.style.display = 'none';
            st.innerText = "Hardware matched. Specify your audio lines and load layout.";
        } catch (e) {
            st.innerText = "Lockout Error: Secure context required (HTTPS).";
        }
    });

    vBtn.addEventListener('click', async () => {
        try {
            st.innerText = "Stitching media components...";
            if(worker) worker.terminate();

            aStr1 = await navigator.mediaDevices.getUserMedia({
                audio: { deviceId: { exact: aSel1.value }, echoCancellation: false, noiseSuppression: false, autoGainControl: false }
            });

            aStr2 = await navigator.mediaDevices.getUserMedia({
                audio: { deviceId: { exact: aSel2.value }, echoCancellation: false, noiseSuppression: false, autoGainControl: false }
            });

            bStr = await navigator.mediaDevices.getUserMedia({
                video: { deviceId: { exact: bSel.value }, width: { ideal: 1280 }, height: { ideal: 720 } }
            });
            bVid.srcObject = bStr; await bVid.play();

            oStr = await navigator.mediaDevices.getUserMedia({
                video: { deviceId: { exact: oSel.value }, width: { ideal: 640 }, height: { ideal: 480 } }
            });
            oVid.srcObject = oStr; await oVid.play();

            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            audioDestination = audioCtx.createMediaStreamDestination();

            const source1 = audioCtx.createMediaStreamSource(aStr1);
            const source2 = audioCtx.createMediaStreamSource(aStr2);

            source1.connect(audioDestination);
            source2.connect(audioDestination);

            const workerCode = `
                let timer = null;
                self.onmessage = function(e) {
                    if (e.data === 'start') {
                        timer = setInterval(() => { self.postMessage('tick'); }, 33);
                    } else if (e.data === 'stop') {
                        clearInterval(timer);
                    }
                };
            `;
            const blob = new Blob([workerCode], { type: 'application/javascript' });
            worker = new Worker(URL.createObjectURL(blob));

            worker.onmessage = function(e) {
                if (e.data === 'tick') {
                    ctx.imageSmoothingEnabled = true;
                    ctx.imageSmoothingQuality = 'high';
                    ctx.fillStyle = '#000'; ctx.fillRect(0,0,1280,720);
                    ctx.drawImage(bVid, 0, 0, 1280, 720);
                    ctx.drawImage(oVid, 940, 490, 320, 210);
                }
            };
            worker.postMessage('start');

            vBtn.style.display = 'none';
            rBtn.style.display = 'inline-block';
            st.innerText = "Layout rendering smoothly.";
        } catch (e) {
            st.innerText = "Stream hardware mapping failed.";
        }
    });

    rBtn.addEventListener('click', () => {
        chunks = [];
        
        // FIXED RECORDING ENGINE: Instead of capturing the blurry preview canvas,
        // we feed the raw, high-resolution background video track directly from 
        // the hardware stream line straight into the encoder!
        const recordingStream = new MediaStream();
        
        bStr.getVideoTracks().forEach(t => recordingStream.addTrack(t));
        audioDestination.stream.getAudioTracks().forEach(t => recordingStream.addTrack(t));

        let opt = { 
            mimeType: 'video/webm;codecs=vp8,opus',
            videoBitsPerSecond: 4000000 // Upped to 4Mbps for native crisp playback
        };
        if (!MediaRecorder.isTypeSupported(opt.mimeType)) {
            opt = { mimeType: 'video/webm', videoBitsPerSecond: 4000000 };
        }

        recorder = new MediaRecorder(recordingStream, opt);
        recorder.ondataavailable = (e) => { if(e.data && e.data.size > 0) chunks.push(e.data); };
        
        recorder.onstop = () => {
            const blob = new Blob(chunks, { type: 'video/webm' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = "native_reaction_hd.webm";
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            URL.revokeObjectURL(url); st.innerText = "Saved to Downloads.";
        };

        recorder.start(1000);
        rBtn.style.display = 'none';
        sBtn.style.display = 'inline-block';
        st.innerText = "🔴 RECORDING NATIVE HD SOURCE VIDEO.";
    });

    sBtn.addEventListener('click', () => {
        recorder.stop();
        if(worker) worker.postMessage('stop');
        if (audioCtx) audioCtx.close();
        sBtn.style.display = 'none';
        rBtn.style.display = 'inline-block';
    });
</script>

</body>
</html>
